<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스쿼드 메이커 - 언주중 3-1</title>
  <style>
    :root {
      --primary-color: #1e40af;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-top: 0;
    }
    .step-section {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e5e7eb;
    }
    .step-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .radio-group, .students-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .student-item {
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      user-select: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #fff;
    }
    .student-item.absent {
      background-color: #fee2e2;
      border-color: #fca5a5;
    }
    .student-name {
      cursor: pointer;
      font-weight: 500;
    }
    .student-item.absent .student-name {
      text-decoration: line-through;
      color: #ef4444;
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .badge-gk { background-color: #fef08a; color: #854d0e; }
    .badge-field { background-color: #e0f2fe; color: #0369a1; }
    
    select.score-select {
      padding: 2px 4px;
      font-size: 0.8rem;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      background-color: #f8fafc;
      cursor: pointer;
    }
    .add-student-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .add-student-box input, .add-student-box select {
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }
    .add-student-box input[type="text"] {
      flex: 1;
      min-width: 120px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background-color: #1d4ed8; }
    .btn-add {
      width: auto;
      margin-top: 0;
      background-color: #10b981;
    }
    .btn-add:hover { background-color: #059669; }
    .btn-reset {
      background-color: #6b7280;
      margin-top: 12px;
    }
    .btn-reset:hover { background-color: #4b5563; }
    .btn-reroll { background-color: #059669; }
    .btn-reroll:hover { background-color: #047857; }
    .teams-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }
    .team-box {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
    }
    .team-box h3 { margin-top: 0; text-align: center; }
    .team-box ul { list-style: none; padding: 0; margin: 0; }
    .team-box li { padding: 6px 0; border-bottom: 1px dashed #cbd5e1; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
    .match-result-section {
      margin-top: 20px;
      background: #eff6ff;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>⚽ 스쿼드 메이커 (언주중 3-1)</h1>

  <div class="step-section">
    <div class="step-title">STEP 1. 경기 방식 선택</div>
    <div class="radio-group">
      <label><input type="radio" name="court" value="반코트" checked> 반코트</label>
      <label><input type="radio" name="court" value="풀코트"> 풀코트</label>
    </div>
  </div>

  <div class="step-section">
    <div class="step-title">STEP 2. 선수 설정 및 결석자 제외</div>
    <p style="font-size:0.85rem; color:#6b7280; margin-top:-4px; margin-bottom:12px;">
      💡 <b>이름 클릭</b>: 결석 처리 | <b>[Field/GK] 클릭</b>: 포지션 변경 | <b>숫자 선택</b>: 실력 수정
    </p>
    <div id="studentList" class="students-grid"></div>
    <button class="btn-reset" onclick="resetDefaultData()">초기 상태로 리셋 🔄</button>
  </div>

  <div class="step-section">
    <div class="step-title">STEP 3. 경기 인원 (팀 당)</div>
    <select id="playerCountSelect" style="padding: 8px; width: 100%; border-radius: 6px;">
      <option value="5">5 대 5</option>
      <option value="6" selected>6 대 6</option>
      <option value="7">7 대 7</option>
      <option value="8">8 대 8</option>
      <option value="9">9 대 9</option>
    </select>
  </div>

  <div class="step-section">
    <button onclick="generateTeams()">팀 뽑기 🎲</button>
    
    <div id="resultContainer" style="display:none;">
      <div class="teams-container">
        <div class="team-box">
          <h3 style="color:#2563eb;">A 팀 (점수: <span id="scoreA"></span>)</h3>
          <ul id="listA"></ul>
        </div>
        <div class="team-box">
          <h3 style="color:#dc2626;">B 팀 (점수: <span id="scoreB"></span>)</h3>
          <ul id="listB"></ul>
        </div>
      </div>
      <button class="btn-reroll" onclick="generateTeams()" style="margin-top: 12px;">마음에 안 듦 (리롤 🔄)</button>
      
      <div class="match-result-section">
        <div class="step-title">STEP 4. 경기 결과 입력 (실력 반영)</div>
        <p style="font-size: 0.85rem; color: #4b5563; margin-top: 0;">승리한 팀의 선수들 레이팅이 상승하여 다음 팀 뽑기 밸런스에 반영됩니다.</p>
        <div style="display:flex; gap: 8px;">
          <button onclick="recordResult('A')" style="background:#2563eb;">A팀 승리</button>
          <button onclick="recordResult('DRAW')" style="background:#4b5563;">무승부</button>
          <button onclick="recordResult('B')" style="background:#dc2626;">B팀 승리</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // 기본 명단 (이건희 제외 19명)
  const defaultStudents = [
    { id: 1, name: "권혁준", position: "FIELD", score: 3.0, absent: false },
    { id: 2, name: "김도연", position: "FIELD", score: 3.0, absent: false },
    { id: 3, name: "김세진", position: "FIELD", score: 3.0, absent: false },
    { id: 4, name: "김정호", position: "FIELD", score: 3.0, absent: false },
    { id: 5, name: "박정준", position: "FIELD", score: 3.0, absent: false },
    { id: 6, name: "박준영", position: "FIELD", score: 3.0, absent: false },
    { id: 7, name: "박채움", position: "FIELD", score: 3.0, absent: false },
    { id: 8, name: "서윤우", position: "FIELD", score: 3.0, absent: false },
    { id: 9, name: "손보승", position: "FIELD", score: 3.0, absent: false },
    { id: 10, name: "송현규", position: "FIELD", score: 3.0, absent: false },
    { id: 11, name: "신율호", position: "FIELD", score: 3.0, absent: false },
    { id: 12, name: "신지원", position: "FIELD", score: 3.0, absent: false },
    { id: 13, name: "이규현", position: "FIELD", score: 3.0, absent: false },
    { id: 14, name: "이규호", position: "FIELD", score: 3.0, absent: false },
    { id: 15, name: "이민섭", position: "FIELD", score: 3.0, absent: false },
    { id: 16, name: "장재혁", position: "FIELD", score: 3.0, absent: false },
    { id: 17, name: "정주원", position: "FIELD", score: 3.0, absent: false },
    { id: 18, name: "하정우", position: "FIELD", score: 3.0, absent: false },
    { id: 19, name: "조훈", position: "FIELD", score: 3.0, absent: false }
  ];

  let students = JSON.parse(localStorage.getItem('unju_3_1_players')) || defaultStudents;
  let currentTeamA = [];
  let currentTeamB = [];

  // 학생 목록 출력
  function renderStudents() {
    const listEl = document.getElementById('studentList');
    listEl.innerHTML = '';

    students.forEach(student => {
      const item = document.createElement('div');
      item.className = `student-item ${student.absent ? 'absent' : ''}`;
      
      // 1. 포지션 뱃지
      const posBadge = document.createElement('span');
      posBadge.className = `badge ${student.position === 'GK' ? 'badge-gk' : 'badge-field'}`;
      posBadge.innerText = student.position === 'GK' ? 'GK' : 'Field';
      posBadge.onclick = () => {
        student.position = student.position === 'GK' ? 'FIELD' : 'GK';
        saveData();
        renderStudents();
      };

      // 2. 학생 이름 (클릭 시 결석 처리)
      const nameText = document.createElement('span');
      nameText.className = 'student-name';
      nameText.innerText = student.name;
      nameText.onclick = () => {
        student.absent = !student.absent;
        renderStudents();
      };

      // 3. 실력 선택 드롭다운 (1.0 ~ 5.0)
      const scoreSelect = document.createElement('select');
      scoreSelect.className = 'score-select';
      const scores = [5.0, 4.5, 4.0, 3.5, 3.0, 2.5, 2.0, 1.5, 1.0];
      
      scores.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.innerText = s.toFixed(1);
        if (Math.abs(student.score - s) < 0.1) opt.selected = true;
        scoreSelect.appendChild(opt);
      });

      scoreSelect.onchange = (e) => {
        student.score = parseFloat(e.target.value);
        saveData();
      };

      item.appendChild(posBadge);
      item.appendChild(nameText);
      item.appendChild(scoreSelect);
      listEl.appendChild(item);
    });
  }

  function resetDefaultData() {
    if (confirm('실력 수치와 포지션을 초기 상태로 리셋하시겠습니까?')) {
      students = JSON.parse(JSON.stringify(defaultStudents));
      saveData();
      renderStudents();
    }
  }

  function saveData() {
    localStorage.setItem('unju_3_1_players', JSON.stringify(students));
  }

  // 팀 생성 알고리즘 (GK 분배 + 실력 밸런스)
  function generateTeams() {
    const activePlayers = students.filter(s => !s.absent);
    const targetCount = parseInt(document.getElementById('playerCountSelect').value);
    
    if (activePlayers.length < targetCount * 2) {
      alert(`출석 인원(${activePlayers.length}명)이 설정한 경기 인원(${targetCount * 2}명)보다 부족합니다.`);
      return;
    }

    let gks = activePlayers.filter(p => p.position === 'GK').sort(() => Math.random() - 0.5);
    let fields = activePlayers.filter(p => p.position === 'FIELD').sort(() => Math.random() - 0.5);

    let teamA = [];
    let teamB = [];

    // GK 분배
    if (gks.length >= 2) {
      teamA.push(gks.pop());
      teamB.push(gks.pop());
    } else if (gks.length === 1) {
      if (Math.random() > 0.5) teamA.push(gks.pop()); else teamB.push(gks.pop());
    }

    let remainingPool = [...gks, ...fields];
    remainingPool.sort((a, b) => b.score - a.score);

    remainingPool.forEach((player) => {
      if (teamA.length < targetCount && teamB.length < targetCount) {
        if (teamA.length <= teamB.length) {
          if (Math.random() > 0.3) teamA.push(player); else teamB.push(player);
        } else {
          if (Math.random() > 0.3) teamB.push(player); else teamA.push(player);
        }
      } else if (teamA.length < targetCount) {
        teamA.push(player);
      } else if (teamB.length < targetCount) {
        teamB.push(player);
      }
    });

    currentTeamA = teamA;
    currentTeamB = teamB;

    displayTeams();
  }

  function displayTeams() {
    document.getElementById('resultContainer').style.display = 'block';
    
    const listAEl = document.getElementById('listA');
    const listBEl = document.getElementById('listB');
    listAEl.innerHTML = '';
    listBEl.innerHTML = '';

    let sumA = 0, sumB = 0;

    currentTeamA.forEach(p => {
      sumA += p.score;
      const tag = p.position === 'GK' ? '<span class="badge badge-gk">GK</span>' : '<span class="badge badge-field">Field</span>';
      listAEl.innerHTML += `<li><span>${tag} ${p.name}</span> <small>(${p.score.toFixed(1)})</small></li>`;
    });

    currentTeamB.forEach(p => {
      sumB += p.score;
      const tag = p.position === 'GK' ? '<span class="badge badge-gk">GK</span>' : '<span class="badge badge-field">Field</span>';
      listBEl.innerHTML += `<li><span>${tag} ${p.name}</span> <small>(${p.score.toFixed(1)})</small></li>`;
    });

    document.getElementById('scoreA').innerText = sumA.toFixed(1);
    document.getElementById('scoreB').innerText = sumB.toFixed(1);
  }

  function recordResult(winner) {
    const K = 0.2;
    
    if (winner === 'A') {
      currentTeamA.forEach(p => updateScore(p.id, K));
      currentTeamB.forEach(p => updateScore(p.id, -K));
      alert('A팀 승리 반영 완료!');
    } else if (winner === 'B') {
      currentTeamA.forEach(p => updateScore(p.id, -K));
      currentTeamB.forEach(p => updateScore(p.id, K));
      alert('B팀 승리 반영 완료!');
    } else {
      alert('무승부는 점수에 변동을 주지 않습니다.');
    }

    saveData();
    renderStudents();
  }

  function updateScore(id, delta) {
    const player = students.find(s => s.id === id);
    if (player) {
      player.score = Math.max(1.0, Math.min(5.0, player.score + delta));
    }
  }

  renderStudents();
</script>

</body>
</html>
