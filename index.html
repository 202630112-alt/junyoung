<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스쿼드 메이커 - 언주중 3-1</title>
  <style>
    :root {
      --primary-color: #1e40af;
      --bg-color: #060913;
      --card-bg: #0f172a;
      --text-color: #f8fafc;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: var(--text-color);
      overflow-x: hidden;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      border: 1px solid #1e293b;
    }
    h1 {
      text-align: center;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 0;
      font-size: 2rem;
      font-weight: 900;
    }
    .step-section {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }
    .step-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #94a3b8;
    }
    .students-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .student-item {
      padding: 6px 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      user-select: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #0b0f19;
    }
    .student-item.absent {
      background-color: #450a0a;
      border-color: #991b1b;
      opacity: 0.6;
    }
    .student-name {
      cursor: pointer;
      font-weight: 600;
    }
    .student-item.absent .student-name {
      text-decoration: line-through;
      color: #f87171;
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .badge-gk { background-color: #eab308; color: #000; }
    .badge-field { background-color: #0284c7; color: #fff; }
    
    select.score-select {
      padding: 2px 4px;
      font-size: 0.8rem;
      border-radius: 4px;
      border: 1px solid #475569;
      background-color: #1e293b;
      color: #fff;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5); }
    .btn-reset { background: #334155; margin-top: 12px; box-shadow: none; font-size: 0.95rem; padding: 10px; }
    .btn-reroll { background: linear-gradient(135deg, #059669, #047857); }

    /* 🎴 초화려 무지갯빛 연출 오버레이 */
    .pack-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #030712;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      user-select: none;
      perspective: 1200px;
      overflow: hidden;
    }

    /* 백그라운드 광원 파티클 레이어 */
    .light-flare {
      position: absolute;
      width: 150vw; height: 150vh;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }

    /* 3D 래퍼 */
    .card-wrapper {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    /* 피파 스타일 하이엔드 카드 기본 */
    .fifa-card {
      width: 300px;
      height: 440px;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 26px 20px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      backface-visibility: hidden;
      transition: all 0.3s;
    }

    /* 홀로그램 빛 반사 효과 */
    .fifa-card::before {
      content: '';
      position: absolute;
      top: -100%; left: -100%; width: 300%; height: 300%;
      background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
      transform: rotate(25deg);
      pointer-events: none;
      animation: holoShine 3s infinite linear;
    }
    @keyframes holoShine {
      0% { transform: translateY(-30%) rotate(25deg); }
      100% { transform: translateY(30%) rotate(25deg); }
    }

    /* 👑 5성 PLATINUM (무지개 오로라 폭발 연출) */
    .fifa-card.platinum-card {
      background: linear-gradient(135deg, #ffffff, #e2e8f0, #cbd5e1);
      border: 3px solid #ffffff;
      color: #0f172a;
      box-shadow: 
        0 0 30px rgba(255, 255, 255, 0.9),
        0 0 80px rgba(236, 72, 153, 0.7),
        0 0 120px rgba(59, 130, 246, 0.7);
      animation: rainbowGlow 2s infinite alternate, cardFloat 3s infinite ease-in-out;
    }
    .fifa-card.platinum-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(45deg, rgba(255,0,0,0.15), rgba(255,154,0,0.15), rgba(208,222,33,0.15), rgba(79,220,74,0.15), rgba(63,218,216,0.15), rgba(47,201,226,0.15), rgba(28,127,238,0.15), rgba(95,21,242,0.15), rgba(186,12,248,0.15), rgba(251,7,217,0.15));
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* 💎 4.5성 DIAMOND (강렬한 코발트/사이버 플라즈마) */
    .fifa-card.diamond-card {
      background: linear-gradient(135deg, #0f172a, #0284c7, #38bdf8, #6366f1);
      background-size: 200% 200%;
      border: 3px solid #7dd3fc;
      color: #ffffff;
      box-shadow: 
        0 0 25px rgba(56, 189, 248, 0.9),
        0 0 70px rgba(99, 102, 241, 0.8);
      animation: gradientShift 3s ease infinite alternate, cardFloat 3s infinite ease-in-out;
    }

    /* 🥇 4성 GOLD (황금 오라 연출) */
    .fifa-card.gold-card {
      background: linear-gradient(135deg, #451a03, #b45309, #f59e0b, #fde047);
      background-size: 200% 200%;
      border: 3px solid #fef08a;
      color: #ffffff;
      box-shadow: 
        0 0 20px rgba(245, 158, 11, 0.8),
        0 0 50px rgba(251, 191, 36, 0.6);
      animation: gradientShift 4s ease infinite alternate;
    }

    /* 🥈 실버 카드 */
    .fifa-card.silver-card {
      background: linear-gradient(135deg, #1e293b, #334155, #475569);
      border: 2px solid #94a3b8;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    @keyframes rainbowGlow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* 연출 애니메이션 */
    .animate-bounce-in {
      animation: packOpen 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .screen-shake {
      animation: cameraShake 0.4s ease-in-out;
    }

    @keyframes packOpen {
      0% { transform: scale(0.05) rotateY(180deg); opacity: 0; }
      70% { transform: scale(1.15) rotateY(0deg); }
      100% { transform: scale(1) rotateY(0deg); opacity: 1; }
    }

    @keyframes cameraShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 10px); }
      40% { transform: translate(10px, -10px); }
      60% { transform: translate(-8px, -8px); }
      80% { transform: translate(8px, 8px); }
    }

    .card-team-tag {
      position: absolute;
      top: 18px; left: 18px;
      font-weight: 900;
      font-size: 1.1rem;
      padding: 4px 14px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 2;
    }
    .team-tag-a { background: #2563eb; color: #fff; }
    .team-tag-b { background: #dc2626; color: #fff; }

    .card-tier-tag {
      position: absolute;
      top: 18px; right: 18px;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    .card-stars { font-size: 1.5rem; color: #fde047; margin-top: 35px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); z-index: 2; }
    .platinum-card .card-stars { color: #d97706; }
    .card-pos { font-size: 1.2rem; font-weight: 900; letter-spacing: 1.5px; z-index: 2; }
    .card-avatar { font-size: 5.5rem; margin: 10px 0; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6)); z-index: 2; }
    .card-name { font-size: 2rem; font-weight: 900; text-shadow: 0 3px 10px rgba(0,0,0,0.8); z-index: 2; }

    /* 로딩 티저 카운트다운 */
    .teaser-text {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #0284c7;
      margin-bottom: 20px;
    }

    /* 결과 스쿼드 카드 배치 */
    .teams-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 16px;
    }
    .team-box {
      background: #0b0f19;
      border: 2px solid #1e293b;
      border-radius: 16px;
      padding: 18px;
    }
    .team-box h3 { margin-top: 0; text-align: center; }

    .squad-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .mini-card {
      border-radius: 14px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    .mini-card:hover { transform: translateY(-5px) scale(1.05); }

    .mini-card.platinum-card {
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      border: 2px solid #ffffff;
      color: #0f172a;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
    }
    .mini-card.diamond-card {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      border: 2px solid #7dd3fc; color: #fff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }
    .mini-card.gold-card {
      background: linear-gradient(135deg, #b45309, #f59e0b);
      border: 2px solid #fde047; color: #fff;
    }
    .mini-card.silver-card {
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 1px solid #64748b; color: #fff;
    }

    .mini-pos {
      font-size: 0.7rem;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: bold;
      align-self: flex-start;
    }
    .mini-avatar { font-size: 2.2rem; margin: 4px 0; }
    .mini-name { font-size: 1rem; font-weight: bold; text-align: center; }
    .mini-stars { font-size: 0.75rem; color: #fde047; margin-top: 4px; font-weight: bold; }
    .platinum-card .mini-stars { color: #d97706; }

    .match-result-section {
      margin-top: 20px;
      background: #0b0f19;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎮 스쿼드 메이커 (언주중 3-1)</h1>

  <!-- STEP 1: 경기 방식 -->
  <div class="step-section">
    <div class="step-title">STEP 1. 경기 방식 선택</div>
    <div style="display:flex; gap:16px;">
      <label><input type="radio" name="court" value="반코트" checked> 반코트</label>
      <label><input type="radio" name="court" value="풀코트"> 풀코트</label>
    </div>
  </div>

  <!-- STEP 2: 출석 및 실력 설정 -->
  <div class="step-section">
    <div class="step-title">STEP 2. 선수 설정 및 결석자 제외</div>
    <p style="font-size:0.85rem; color:#94a3b8; margin-top:-4px; margin-bottom:12px;">
      💡 <b>이름 클릭</b>: 결석 처리 | <b>[Field/GK] 클릭</b>: 포지션 변경 | <b>별점 선택</b>: 실력 수정
    </p>
    <div id="studentList" class="students-grid"></div>
    <button class="btn-reset" onclick="resetDefaultData()">기본 상태로 리셋 🔄</button>
  </div>

  <!-- STEP 3: 경기 인원 설정 -->
  <div class="step-section">
    <div class="step-title">STEP 3. 경기 인원 (팀 당)</div>
    <select id="playerCountSelect" style="padding: 12px; width: 100%; border-radius: 10px; background:#0b0f19; color:#fff; border:1px solid #334155; font-size: 1rem;">
      <option value="5">5 대 5</option>
      <option value="6">6 대 6</option>
      <option value="7">7 대 7</option>
      <option value="8">8 대 8</option>
      <option value="9" selected>9 대 9</option>
    </select>
  </div>

  <!-- STEP 4: 팀 생성 -->
  <div class="step-section">
    <button onclick="startPackReveal()">🔥 울트라 카드팩 개봉 & 팀 뽑기 ✨</button>
    
    <div id="resultContainer" style="display:none;">
      <div class="teams-container">
        <div class="team-box">
          <h3 style="color:#60a5fa;">A 팀 (총점: <span id="scoreA"></span>)</h3>
          <div id="cardsA" class="squad-cards-grid"></div>
        </div>
        <div class="team-box">
          <h3 style="color:#f87171;">B 팀 (총점: <span id="scoreB"></span>)</h3>
          <div id="cardsB" class="squad-cards-grid"></div>
        </div>
      </div>
      <button class="btn-reroll" onclick="startPackReveal()" style="margin-top: 16px;">다시 뽑기 (리롤 🔄)</button>
      
      <!-- STEP 5: 경기 결과 입력 -->
      <div class="match-result-section">
        <div class="step-title">STEP 4. 경기 결과 입력 (레이팅 반영)</div>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0;">승리한 팀의 선수 별점이 상승하여 다음 밸런스에 반영됩니다.</p>
        <div style="display:flex; gap: 8px;">
          <button onclick="recordResult('A')" style="background:#2563eb;">A팀 승리</button>
          <button onclick="recordResult('DRAW')" style="background:#475569;">무승부</button>
          <button onclick="recordResult('B')" style="background:#dc2626;">B팀 승리</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 🎴 초화려 무지갯빛 카드팩 오버레이 -->
<div id="packOverlay" class="pack-overlay" style="display:none;" onclick="handleOverlayClick()">
  <div class="light-flare" id="lightFlare"></div>
  
  <div id="teaserText" class="teaser-text" style="display:none;">⚡ OPENING PACK... ⚡</div>
  <div style="color:#94a3b8; margin-bottom:15px; font-size:0.95rem; z-index:10;">화면을 클릭하면 다음 선수가 나옵니다 (<span id="revealProgress">0/0</span>)</div>
  
  <div class="card-wrapper" id="cardWrapper">
    <div id="fifaCard" class="fifa-card">
      <div id="cardTeamTag" class="card-team-tag">A팀</div>
      <div id="cardTierTag" class="card-tier-tag">NORMAL</div>
      <div style="text-align:center;">
        <div id="cardStars" class="card-stars">★★★★★</div>
        <div id="cardPos" class="card-pos">FIELD</div>
      </div>
      <div class="card-avatar" id="cardAvatar">🏃</div>
      <div id="cardName" class="card-name">선수이름</div>
    </div>
  </div>

  <button onclick="skipReveal(event)" style="width:auto; padding:8px 24px; margin-top:30px; background:rgba(255,255,255,0.15); font-size:0.9rem; border:1px solid rgba(255,255,255,0.3); z-index:10;">스킵 ⏩</button>
</div>

<script>
  // 📌 사진 속 최종 점수
  const defaultStudents = [
    { id: 1,  name: "권혁준", position: "FIELD", score: 4.0, absent: false },
    { id: 2,  name: "김도연", position: "FIELD", score: 5.0, absent: false },
    { id: 3,  name: "김세진", position: "FIELD", score: 4.5, absent: false },
    { id: 4,  name: "김정호", position: "GK",    score: 5.0, absent: false },
    { id: 5,  name: "박정준", position: "FIELD", score: 4.0, absent: false },
    { id: 6,  name: "박준영", position: "FIELD", score: 4.0, absent: false },
    { id: 7,  name: "박채움", position: "FIELD", score: 2.0, absent: false },
    { id: 8,  name: "서윤우", position: "FIELD", score: 1.5, absent: false },
    { id: 9,  name: "손보승", position: "FIELD", score: 2.5, absent: false },
    { id: 10, name: "송현규", position: "FIELD", score: 4.0, absent: false },
    { id: 11, name: "신율호", position: "GK",    score: 5.0, absent: false },
    { id: 12, name: "신지원", position: "FIELD", score: 3.5, absent: false },
    { id: 13, name: "이규현", position: "FIELD", score: 4.0, absent: false },
    { id: 14, name: "이규호", position: "FIELD", score: 4.5, absent: false },
    { id: 15, name: "이민섭", position: "FIELD", score: 4.5, absent: false },
    { id: 16, name: "장재혁", position: "FIELD", score: 4.5, absent: false },
    { id: 17, name: "정주원", position: "FIELD", score: 4.5, absent: false },
    { id: 18, name: "하정우", position: "FIELD", score: 5.0, absent: false },
    { id: 19, name: "조훈",   position: "FIELD", score: 1.0, absent: false }
  ];

  let students = JSON.parse(localStorage.getItem('unju_3_1_players')) || defaultStudents;
  let currentTeamA = [], currentTeamB = [];
  let revealList = [];
  let currentRevealIndex = 0;
  let isRevealing = false;

  /* 오디오 파워풀 사운드 합성기 */
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'whoosh') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(500, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    } else if (type === 'boom') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'platinum') {
      // 5성 전용 웅장한 아르페지오 사운드
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
        o.connect(g);
        g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.08);
        g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.08 + 0.5);
        o.start(audioCtx.currentTime + idx * 0.08);
        o.stop(audioCtx.currentTime + idx * 0.08 + 0.5);
      });
    }
  }

  function getStarRating(score) {
    const fullStars = Math.floor(score);
    const hasHalf = (score % 1) >= 0.5;
    let stars = '★'.repeat(fullStars);
    if (hasHalf) stars += '☆';
    while (stars.length < 5) stars += 'ㆍ';
    return `${stars} (${score.toFixed(1)})`;
  }

  function renderStudents() {
    const listEl = document.getElementById('studentList');
    listEl.innerHTML = '';

    students.forEach(student => {
      const item = document.createElement('div');
      item.className = `student-item ${student.absent ? 'absent' : ''}`;
      
      const posBadge = document.createElement('span');
      posBadge.className = `badge ${student.position === 'GK' ? 'badge-gk' : 'badge-field'}`;
      posBadge.innerText = student.position === 'GK' ? 'GK' : 'Field';
      posBadge.onclick = () => {
        student.position = student.position === 'GK' ? 'FIELD' : 'GK';
        saveData();
        renderStudents();
      };

      const nameText = document.createElement('span');
      nameText.className = 'student-name';
      nameText.innerText = student.name;
      nameText.onclick = () => {
        student.absent = !student.absent;
        renderStudents();
      };

      const scoreSelect = document.createElement('select');
      scoreSelect.className = 'score-select';
      const scores = [5.0, 4.5, 4.0, 3.5, 3.0, 2.5, 2.0, 1.5, 1.0];
      
      scores.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.innerText = `★ ${s.toFixed(1)}`;
        if (Math.abs(student.score - s) < 0.1) opt.selected = true;
        scoreSelect.appendChild(opt);
      });

      scoreSelect.onchange = (e) => {
        student.score = parseFloat(e.target.value);
        saveData();
      };

      item.appendChild(posBadge);
      item.appendChild(nameText);
      item.appendChild(scoreSelect);
      listEl.appendChild(item);
    });
  }

  function resetDefaultData() {
    if (confirm('모든 설정을 이미지속 기본 점수로 리셋할까요?')) {
      students = JSON.parse(JSON.stringify(defaultStudents));
      saveData();
      renderStudents();
    }
  }

  function saveData() {
    localStorage.setItem('unju_3_1_players', JSON.stringify(students));
  }

  function generateTeams() {
    const activePlayers = students.filter(s => !s.absent);
    const targetCount = parseInt(document.getElementById('playerCountSelect').value);
    
    if (activePlayers.length < targetCount * 2) {
      alert(`출석 인원(${activePlayers.length}명)이 설정한 경기 인원(${targetCount * 2}명)보다 부족합니다.`);
      return false;
    }

    let gks = activePlayers.filter(p => p.position === 'GK').sort(() => Math.random() - 0.5);
    let fields = activePlayers.filter(p => p.position === 'FIELD').sort(() => Math.random() - 0.5);

    let teamA = [], teamB = [];

    if (gks.length >= 2) {
      teamA.push(gks.pop()); teamB.push(gks.pop());
    } else if (gks.length === 1) {
      if (Math.random() > 0.5) teamA.push(gks.pop()); else teamB.push(gks.pop());
    }

    let remainingPool = [...gks, ...fields];
    remainingPool.sort((a, b) => b.score - a.score);

    remainingPool.forEach((player) => {
      if (teamA.length < targetCount && teamB.length < targetCount) {
        if (teamA.length <= teamB.length) {
          if (Math.random() > 0.3) teamA.push(player); else teamB.push(player);
        } else {
          if (Math.random() > 0.3) teamB.push(player); else teamA.push(player);
        }
      } else if (teamA.length < targetCount) {
        teamA.push(player);
      } else if (teamB.length < targetCount) {
        teamB.push(player);
      }
    });

    currentTeamA = teamA;
    currentTeamB = teamB;
    return true;
  }

  function startPackReveal() {
    if (!generateTeams()) return;

    revealList = [
      ...currentTeamA.map(p => ({ ...p, team: 'A' })),
      ...currentTeamB.map(p => ({ ...p, team: 'B' }))
    ];
    
    // 점수 높은 순 정렬
    revealList.sort((a, b) => a.score - b.score);

    currentRevealIndex = 0;
    document.getElementById('packOverlay').style.display = 'flex';
    showCardWithTeaser(currentRevealIndex);
  }

  function showCardWithTeaser(index) {
    if (index >= revealList.length) {
      finishReveal();
      return;
    }

    isRevealing = true;
    const player = revealList[index];
    const cardEl = document.getElementById('fifaCard');
    const cardWrapper = document.getElementById('cardWrapper');
    const teaserText = document.getElementById('teaserText');
    const flare = document.getElementById('lightFlare');
    const tagEl = document.getElementById('cardTeamTag');
    const tierEl = document.getElementById('cardTierTag');
    const overlay = document.getElementById('packOverlay');

    document.getElementById('revealProgress').innerText = `${index + 1}/${revealList.length}`;

    cardWrapper.style.display = 'none';
    teaserText.style.display = 'block';
    flare.style.opacity = '0';
    playSound('whoosh');

    if (player.score >= 5.0) {
      teaserText.innerText = "👑 PLATINUM LEGEND 👑";
      teaserText.style.color = "#ec4899";
    } else if (player.score >= 4.5) {
      teaserText.innerText = "💎 HIGH TIER DETECTED 💎";
      teaserText.style.color = "#38bdf8";
    } else {
      teaserText.innerText = "⚡ OPENING PLAYER... ⚡";
      teaserText.style.color = "#f59e0b";
    }

    setTimeout(() => {
      teaserText.style.display = 'none';
      cardWrapper.style.display = 'block';
      
      cardEl.className = 'fifa-card animate-bounce-in';
      overlay.className = 'pack-overlay screen-shake';

      setTimeout(() => overlay.className = 'pack-overlay', 400);

      tagEl.innerText = `${player.team}팀`;
      tagEl.className = `card-team-tag ${player.team === 'A' ? 'team-tag-a' : 'team-tag-b'}`;

      document.getElementById('cardStars').innerText = getStarRating(player.score);
      document.getElementById('cardPos').innerText = player.position;
      document.getElementById('cardName').innerText = player.name;
      document.getElementById('cardAvatar').innerText = player.position === 'GK' ? '🧤' : '🏃';

      if (player.score >= 5.0) {
        cardEl.classList.add('platinum-card');
        tierEl.innerText = '5.0★ PLATINUM';
        flare.style.opacity = '1';
        flare.style.background = 'radial-gradient(circle, rgba(236,72,153,0.6) 0%, rgba(59,130,246,0.4) 40%, transparent 80%)';
        playSound('platinum');
      } else if (player.score >= 4.5) {
        cardEl.classList.add('diamond-card');
        tierEl.innerText = '4.5★ DIAMOND';
        flare.style.opacity = '0.8';
        flare.style.background = 'radial-gradient(circle, rgba(56,189,248,0.7) 0%, transparent 75%)';
        playSound('boom');
      } else if (player.score >= 4.0) {
        cardEl.classList.add('gold-card');
        tierEl.innerText = '4.0★ GOLD';
        flare.style.opacity = '0.5';
        flare.style.background = 'radial-gradient(circle, rgba(245,158,11,0.6) 0%, transparent 70%)';
        playSound('boom');
      } else {
        cardEl.classList.add('silver-card');
        tierEl.innerText = 'SILVER';
      }

      isRevealing = false;
    }, player.score >= 4.5 ? 700 : 350);
  }

  document.getElementById('packOverlay').addEventListener('mousemove', (e) => {
    const cardWrapper = document.getElementById('cardWrapper');
    const x = (window.innerWidth / 2 - e.clientX) / 12;
    const y = (window.innerHeight / 2 - e.clientY) / 12;
    cardWrapper.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
  });

  function handleOverlayClick() {
    if (isRevealing) return;
    currentRevealIndex++;
    if (currentRevealIndex < revealList.length) {
      showCardWithTeaser(currentRevealIndex);
    } else {
      finishReveal();
    }
  }

  function skipReveal(e) {
    e.stopPropagation();
    finishReveal();
  }

  function finishReveal() {
    document.getElementById('packOverlay').style.display = 'none';
    displayTeams();
  }

  function displayTeams() {
    document.getElementById('resultContainer').style.display = 'block';
    
    const cardsAEl = document.getElementById('cardsA');
    const cardsBEl = document.getElementById('cardsB');
    cardsAEl.innerHTML = '';
    cardsBEl.innerHTML = '';

    let sumA = 0, sumB = 0;

    const createMiniCardHtml = (p) => {
      let tierClass = 'silver-card';
      if (p.score >= 5.0) tierClass = 'platinum-card';
      else if (p.score >= 4.5) tierClass = 'diamond-card';
      else if (p.score >= 4.0) tierClass = 'gold-card';

      const posBadge = p.position === 'GK' ? 
        '<span class="mini-pos badge-gk">GK</span>' : 
        '<span class="mini-pos badge-field">Field</span>';

      const avatar = p.position === 'GK' ? '🧤' : '🏃';

      return `
        <div class="mini-card ${tierClass}">
          ${posBadge}
          <div class="mini-avatar">${avatar}</div>
          <div class="mini-name">${p.name}</div>
          <div class="mini-stars">★ ${p.score.toFixed(1)}</div>
        </div>
      `;
    };

    currentTeamA.forEach(p => {
      sumA += p.score;
      cardsAEl.innerHTML += createMiniCardHtml(p);
    });

    currentTeamB.forEach(p => {
      sumB += p.score;
      cardsBEl.innerHTML += createMiniCardHtml(p);
    });

    document.getElementById('scoreA').innerText = `★ ${sumA.toFixed(1)}`;
    document.getElementById('scoreB').innerText = `★ ${sumB.toFixed(1)}`;
  }

  function recordResult(winner) {
    const K = 0.2;
    if (winner === 'A') {
      currentTeamA.forEach(p => updateScore(p.id, K));
      currentTeamB.forEach(p => updateScore(p.id, -K));
      alert('A팀 승리 반영 완료!');
    } else if (winner === 'B') {
      currentTeamA.forEach(p => updateScore(p.id, -K));
      currentTeamB.forEach(p => updateScore(p.id, K));
      alert('B팀 승리 반영 완료!');
    } else {
      alert('무승부는 점수에 변동을 주지 않습니다.');
    }
    saveData();
    renderStudents();
  }

  function updateScore(id, delta) {
    const player = students.find(s => s.id === id);
    if (player) {
      player.score = Math.max(1.0, Math.min(5.0, player.score + delta));
    }
  }

  renderStudents();
</script>

</body>
</html>
